[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanoi-inf101"
version = "1.0.0"
description = "Towers of Hanoi desktop and console game"
requires-python = ">=3.10"
dependencies = ["customtkinter>=5.2,<6"]
authors = [{name = "Mhamad Deaibess"}, {name = "Karim Hammoud"}]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
hanoi = "hanoi.__main__:main"

[tool.setuptools.packages.find]
include = ["hanoi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
